<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anon Keyboard clipboard panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#33B5E5}a:hover{color:#7FD3F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #101112; color: #F2F2F2; font-family: Roboto, system-ui, sans-serif;">
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px 16px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #A9ACB1;">Message
      <input type="text" value="" placeholder="Type a message" style="height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 22px; border: 1px solid #2E2F31; background: #2C2D2F; color: #F2F2F2; font-size: 16px; font-family: inherit;">
    </label>
  </div>
  <div style="background: #1B1B1C; padding: 0 4px 10px; display: flex; flex-direction: column; gap: 8px; height: 292px; box-sizing: border-box;">
    <div style="height: 44px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2E2F31;">
      <button aria-label="Back to keys" style="width: 44px; height: 44px; border: 0; background: transparent; color: #F2F2F2; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <span style="flex-grow: 1; font-size: 15px; font-weight: 600;">Clipboard</span>
      <span style="font-size: 12px; color: #A9ACB1; padding-right: 12px;">4 of 30 · clears after 1 h</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; overflow: hidden; flex-grow: 1;">
      <sc-for list="{{clips}}" as="c" hint-placeholder-count="4">
        <button style="min-height: 48px; border: 0; border-radius: 6px; background: #2C2D2F; color: #F2F2F2; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: inherit; font-size: 15px; text-align: left;">
          <span style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{c.text}}</span>
          <sc-if value="{{c.pinned}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; color: #33B5E5; font-weight: 600;">Pinned</span>
          </sc-if>
          <span style="font-size: 12px; color: #A9ACB1;">{{c.age}}</span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 0; padding: 0 8px; font-size: 12px; color: #A9ACB1;">Tap to paste · long-press to pin or delete · passwords are never saved</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      clips: [
        { text: 'See you at 7 near the station', age: 'now', pinned: false },
        { text: 'https://example.com/order/[ORDER-ID]', age: '4 min', pinned: false },
        { text: '[YOUR ADDRESS]', age: '', pinned: true },
        { text: 'Meeting notes: send the file tonight', age: '22 min', pinned: false }
      ]
    };
  }
}
</script>
</body>
</html>
