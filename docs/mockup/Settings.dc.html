<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anon Keyboard settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#33B5E5}a:hover{color:#7FD3F2}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; gap: 16px; padding: 24px 16px; background: #101112; color: #F2F2F2; font-family: Roboto, system-ui, sans-serif;">
  <h1 style="margin: 0; font-size: 24px; font-weight: 700;">Anon Keyboard</h1>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <section style="display: flex; flex-direction: column; gap: 2px;">
      <h2 style="margin: 0 0 6px 4px; font-size: 13px; font-weight: 600; color: #A9ACB1; text-transform: uppercase; letter-spacing: 0.04em;">{{g.name}}</h2>
      <div style="display: flex; flex-direction: column; background: #2C2D2F; border-radius: 12px; overflow: hidden;">
        <sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
          <label style="min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 6px 14px; border-bottom: 1px solid #3A3C40; font-size: 15px;">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">{{it.label}}
              <span style="font-size: 12px; color: #A9ACB1;">{{it.hint}}</span>
            </span>
            <input type="checkbox" checked="{{it.on}}" style="width: 22px; height: 22px; accent-color: #33B5E5;">
          </label>
        </sc-for>
      </div>
    </section>
  </sc-for>
  <label style="display: flex; flex-direction: column; gap: 8px; background: #2C2D2F; border-radius: 12px; padding: 12px 14px; font-size: 15px;">Key height · 100%
    <input type="range" min="80" max="140" step="5" value="100" style="accent-color: #33B5E5;">
  </label>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      groups: [
        { name: 'Smart typing', items: [
          { label: 'Suggestion strip', hint: '3 words above the keys', on: true },
          { label: 'Next-word prediction', hint: 'After space', on: true },
          { label: 'Autocorrect', hint: 'Only when sure; tap to undo', on: true },
          { label: 'Learn my words', hint: 'Stays on this phone', on: true },
          { label: 'Contact names', hint: 'Needs contacts permission', on: false }
        ] },
        { name: 'Clipboard', items: [
          { label: 'Clipboard history', hint: 'Last 30, cleared after 1 h', on: true }
        ] },
        { name: 'Keys', items: [
          { label: 'Auto-capitalize', hint: 'Start of sentence', on: true },
          { label: 'Double space adds a period', hint: '', on: true },
          { label: 'Vibrate on key', hint: '', on: true }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
